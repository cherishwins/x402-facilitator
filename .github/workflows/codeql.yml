name: "CodeQL"

# NOTE: this repository is private. Code scanning on a private repository
# requires GitHub Advanced Security to be enabled for it. Without GHAS the
# analyze step fails with "Advanced Security must be enabled for this
# repository to use code scanning". If GHAS is not on this plan, delete this
# workflow; tests.yml carries the protection that actually matters here.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly. The scheduled run exists to catch newly published advisories
    # against code that has not changed, so it must not depend on a push.
    - cron: '45 13 * * 1'

# A newer push supersedes the run in flight. No reason to pay for both.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Upload findings to the Security tab.
      security-events: write
      # Read the source.
      contents: read
      # Both of these are required because this repository is PRIVATE:
      # actions: read lets CodeQL read workflow run data, and packages: read
      # lets it fetch private CodeQL query packs. On a public repo they are
      # surplus; here they are load-bearing.
      actions: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          # The default pack is deliberately conservative. This service
          # verifies payment settlement, so take the broader security pack.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
